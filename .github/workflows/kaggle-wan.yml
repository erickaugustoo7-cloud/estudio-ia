name: Animar com Wan 2.2 (Kaggle)
run-name: "Animar ${{ inputs.roteiro }}"

on:
  workflow_dispatch:
    inputs:
      roteiro:
        description: "Roteiro em roteiros_animados/"
        required: true
        default: roteiros_animados/tempestade.json
      maquina:
        description: "GPU do Kaggle (NvidiaTeslaT4 ou NvidiaTeslaP100)"
        required: false
        default: NvidiaTeslaT4

permissions:
  contents: write
  issues: write
  actions: write   # fila: consultar as outras execuções e se recolocar na fila

# Sem "concurrency": o GitHub guarda só 1 execução pendente por grupo e cancelava as outras.
# A fila é feita no primeiro passo (espera as execuções mais antigas terminarem).

jobs:
  wan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_MAQUINA: ${{ inputs.maquina }}
      WAN_LIMITE_MIN: "170"
    steps:
      - name: Fila (uma produção por vez no Kaggle)
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          inicio=$(date +%s)
          while true; do
            antes=$(gh api "repos/$GH_REPO/actions/workflows/kaggle-wan.yml/runs?per_page=30" \
              --jq "[.workflow_runs[] | select(.id < ${{ github.run_id }} and (.status == \"in_progress\" or .status == \"queued\"))] | length")
            [ "$antes" = "0" ] && break
            if [ $(( $(date +%s) - inicio )) -gt 7200 ]; then
              echo "esperando há 2 h — volto para o fim da fila"
              gh api -X POST "repos/$GH_REPO/actions/workflows/kaggle-wan.yml/dispatches" -f ref=main \
                -f "inputs[roteiro]=${{ inputs.roteiro }}" -f "inputs[maquina]=${{ inputs.maquina }}"
              gh api -X POST "repos/$GH_REPO/actions/runs/${{ github.run_id }}/cancel"; sleep 120; exit 1
            fi
            echo "na fila: $antes produção(ões) antes desta"; sleep 120
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: FedericoCarboni/setup-ffmpeg@v3
        id: ff
        continue-on-error: true
        timeout-minutes: 5
      - uses: FedericoCarboni/setup-ffmpeg@v3  # 2ª tentativa (o download às vezes falha)
        id: ff2
        if: steps.ff.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 5
      - if: steps.ff.outcome == 'failure' && steps.ff2.outcome == 'failure'
        timeout-minutes: 10   # o apt já travou 50 min: com limite, falha rápido
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements.txt kaggle six
      - name: Fontes
        run: |
          fc-list | grep -qi dejavu || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core)
          mkdir -p assets/fontes
          [ -f assets/fontes/Montserrat.ttf ] || curl -sSfL -o assets/fontes/Montserrat.ttf \
            "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf" || true
      - name: Cache do modelo de alinhamento (Whisper)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Conferir segredos do Kaggle
        run: |
          echo "KAGGLE_USERNAME: ${KAGGLE_USERNAME:+definido} · KAGGLE_KEY: ${KAGGLE_KEY:+definido} · KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:+definido}"
          [ -n "$KAGGLE_USERNAME" ] && { [ -n "$KAGGLE_KEY" ] || [ -n "$KAGGLE_API_TOKEN" ]; } || { echo "::error::Faltam os segredos do Kaggle"; exit 1; }
          python -m kaggle kernels list --mine --page-size 1 >/dev/null && echo "login no Kaggle ok"
      - name: Cache da narração (refazer não gasta a cota da Gemini)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/estudio-voz
          key: voz-${{ hashFiles(inputs.roteiro) }}-${{ github.run_id }}
          restore-keys: voz-${{ hashFiles(inputs.roteiro) }}-
      - name: Animar
        run: python -m estudio.kaggle_wan ${{ inputs.roteiro }}
      - name: Guardar a narração no cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/estudio-voz
          key: voz-${{ hashFiles(inputs.roteiro) }}-${{ github.run_id }}
        continue-on-error: true
      - name: Guardar prévias (branch previas)
        if: always()
        run: |
          mkdir -p /tmp/pv && cp saida/*/previa_*.jpg saida/*/kaggle_log_*.txt /tmp/pv/ 2>/dev/null || true
          ls /tmp/pv | grep -q . || exit 0
          git config user.name "estudio-bot"; git config user.email "estudio-bot@users.noreply.github.com"
          git fetch origin previas && git checkout previas || git checkout --orphan previas
          git rm -rq --cached . 2>/dev/null || true
          mkdir -p previas/${{ github.run_id }} && cp /tmp/pv/* previas/${{ github.run_id }}/
          git add previas && git commit -qm "prévias ${{ github.run_id }}" && git push -q origin previas || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-biblico-${{ github.run_id }}
          path: |
            saida/**/video.mp4
            saida/**/roteiro.json
            saida/**/post.txt
            saida/**/thumb.jpg
          retention-days: 14
          if-no-files-found: ignore
