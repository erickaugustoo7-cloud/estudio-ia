name: Traduzir vídeos já publicados (es/en)
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'   # 06:23 BRT, logo após o reset da cota do Gemini
    - cron: '47 1 * * *'   # 22:47 BRT, pega o que foi subido à mão no dia
jobs:
  traduzir:
    runs-on: ubuntu-latest
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python ferramentas/traduzir_videos_antigos.py
