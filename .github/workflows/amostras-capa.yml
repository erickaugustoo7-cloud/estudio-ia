name: Modelos de miniatura (aprovação)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capas:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: pip install -q -r requirements.txt
      - run: python ferramentas/amostras_capa.py
      - run: |
          git config user.name "estudio-bot"
          git config user.email "estudio-bot@users.noreply.github.com"
          git add assets/amostras_capa && git commit -qm "modelos de miniatura" && git pull -q --rebase && git push -q
