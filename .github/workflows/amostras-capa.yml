name: Modelos de miniatura (aprovação)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "amostras_capa ou refazer_capas"
        default: amostras_capa
      so:
        description: "só estas capas (vírgula), vazio = todas"
        default: ""
permissions:
  contents: write
jobs:
  capas:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SO: ${{ inputs.so }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: pip install -q -r requirements.txt
      - run: python ferramentas/${{ inputs.script || 'amostras_capa' }}.py
      - run: |
          git config user.name "estudio-bot"
          git config user.email "estudio-bot@users.noreply.github.com"
          git add assets/amostras_capa assets/capas_youtube 2>/dev/null; git add -A assets && git commit -qm "modelos de miniatura" && git pull -q --rebase && git push -q
