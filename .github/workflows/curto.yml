name: Produzir vídeos curtos (leão + versículo)

on:
  workflow_dispatch:
    inputs:
      roteiros:
        description: "Arquivos em roteiros_curtos/ separados por espaço (ex.: roteiros_curtos/josue_1_9.json)"
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: curto
  cancel-in-progress: false

jobs:
  curto:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar FFmpeg (binário pronto, com cache)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
      - run: fc-list | grep -qi dejavu || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core)
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar HyperFrames
        run: |
          npm ci --no-audit --no-fund
          npx hyperframes browser ensure || echo "HYPERFRAMES_BROWSER_PATH=$(which google-chrome)" >> "$GITHUB_ENV"
      - name: Produzir
        run: python -m estudio.curto ${{ inputs.roteiros }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-biblico-${{ github.run_id }}
          path: |
            saida/**/video.mp4
            saida/**/roteiro.json
            saida/**/post.txt
            saida/**/leao.jpg
          retention-days: 14
          if-no-files-found: ignore
