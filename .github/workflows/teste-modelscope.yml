name: Teste ModelScope (imagens)
on: workflow_dispatch
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests pillow pyyaml
      - run: |
          echo "MODELSCOPE_TOKEN: ${MODELSCOPE_TOKEN:+definido}"
          python - <<'Q'
          import base64, json, pathlib, sys
          sys.path.insert(0, ".")
          from estudio.kaggle_wan import _rodar_modelscope
          from PIL import Image
          itens = [{"tipo": "imagem", "nome": "t1", "resolucao": "1344x768", "seed": 7, "prompt": "cinematic photorealistic film still: a giant ground sloth the size of an elephant walking across white gypsum sand dunes at dawn, ice age landscape, volumetric light, documentary, no text"},
                   {"tipo": "imagem", "nome": "t2", "resolucao": "1344x768", "seed": 11, "prompt": "cinematic photorealistic film still: a herd of woolly mammoths crossing a snowy steppe under a pale winter sun, tiny distant figures of prehistoric hunters on a ridge, documentary, no text"}]
          p = pathlib.Path("teste"); p.mkdir()
          saida, rel = _rodar_modelscope(itens, p, "teste")
          print("REL", rel)
          for f in sorted(saida.glob("*.png")):
              Image.open(f).convert("RGB").save(f.with_suffix(".jpg"), quality=80)
              b = base64.b64encode(f.with_suffix(".jpg").read_bytes()).decode()
              for i in range(0, len(b), 60000):
                  print(f"IMG {f.stem} {b[i:i+60000]}")
          Q
