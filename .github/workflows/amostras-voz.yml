name: Amostras de voz
on: workflow_dispatch
jobs:
  vozes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: bash ferramentas/instalar_ffmpeg.sh && sudo apt-get install -y -qq espeak-ng >/dev/null || true
      - run: pip install -q edge-tts piper-tts "kokoro>=0.9" soundfile numpy || pip install -q edge-tts piper-tts
      - run: python ferramentas/amostras_voz.py
