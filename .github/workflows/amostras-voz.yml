name: Amostras de voz

# Gera o mesmo texto em várias vozes gratuitas e manda para o Telegram, para escolher a voz.
# Não altera a produção.
on:
  workflow_dispatch:

jobs:
  amostras:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts requests soundfile kokoro-onnx
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts
      - name: Baixar modelo Kokoro
        run: |
          mkdir -p modelos_kokoro && cd modelos_kokoro
          curl -sSfLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSfLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Gerar amostras
        run: python ferramentas/amostras_voz.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amostras-voz
          path: amostras_voz/
