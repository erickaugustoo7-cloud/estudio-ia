name: Fila de publicação

on:
  schedule:
    - cron: "47 10 * * *"   # 07:47 Brasília
    - cron: "47 14 * * *"   # 11:47
    - cron: "47 20 * * *"   # 17:47
    - cron: "47 23 * * *"   # 20:47
  workflow_dispatch:
    inputs:
      acao:
        description: "montar (aprova todos os pendentes e põe na fila) ou publicar (próximo de cada canal)"
        default: publicar

permissions:
  issues: write
  contents: read
  actions: read

concurrency:
  group: fila-publicacao
  cancel-in-progress: false

jobs:
  fila:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IG_TOKEN_BIBLICO: ${{ secrets.IG_TOKEN_BIBLICO }}
      IG_TOKEN_ESPACO: ${{ secrets.IG_TOKEN_ESPACO }}
      META_TOKEN_BIBLICO: ${{ secrets.META_TOKEN_BIBLICO }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_MAXRATE: ${{ vars.IG_MAXRATE || '2500k' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: FedericoCarboni/setup-ffmpeg@v3
        id: ff
        continue-on-error: true
      - if: steps.ff.outcome == 'failure'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements.txt
      - run: python -m estudio.fila_publicacao ${{ inputs.acao || 'publicar' }}
