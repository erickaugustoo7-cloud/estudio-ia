name: Pesquisa de nicho
on:
  workflow_dispatch:
    inputs:
      arquivo:
        default: dados/nichos_teste.txt
jobs:
  pesquisa:
    runs-on: ubuntu-latest
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python ferramentas/pesquisa_nicho.py "${{ inputs.arquivo }}"
      - run: python -c "import json;print('JSON_INICIO');print(json.dumps(json.load(open('pesquisa_nicho.json')),ensure_ascii=False));print('JSON_FIM')"
