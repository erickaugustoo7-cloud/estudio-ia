name: Produzir animações (desenho, até 20 s)

on:
  workflow_dispatch:
    inputs:
      roteiros:
        description: "Arquivos em roteiros_animados/ separados por espaço (ex.: roteiros_animados/tempestade.json)"
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: animado
  cancel-in-progress: false

jobs:
  animado:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar FFmpeg (binário pronto, com cache)
        id: ff
        continue-on-error: true
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
      - uses: FedericoCarboni/setup-ffmpeg@v3  # 2ª tentativa (o download às vezes falha)
        id: ff2
        if: steps.ff.outcome == 'failure'
        continue-on-error: true
        with:
          ffmpeg-version: release
      - if: steps.ff.outcome == 'failure' && steps.ff2.outcome == 'failure'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: fc-list | grep -qi dejavu || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core)
      - run: pip install -r requirements.txt "rembg[cpu]>=2.0.60"
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet-v1
      - name: Cache do modelo de alinhamento (Whisper)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar HyperFrames
        run: |
          npm ci --no-audit --no-fund
          npx hyperframes browser ensure || echo "HYPERFRAMES_BROWSER_PATH=$(which google-chrome)" >> "$GITHUB_ENV"
      - name: Produzir
        run: python -m estudio.animado ${{ inputs.roteiros }}
      - name: Guardar prévias (branch previas)
        if: always()
        run: |
          mkdir -p /tmp/pv && cp saida/*/previa_*.jpg /tmp/pv/ 2>/dev/null || exit 0
          git config user.name "estudio-bot"; git config user.email "estudio-bot@users.noreply.github.com"
          git fetch origin previas && git checkout previas || git checkout --orphan previas
          git rm -rq --cached . 2>/dev/null || true
          mkdir -p previas/${{ github.run_id }} && cp /tmp/pv/*.jpg previas/${{ github.run_id }}/
          git add previas && git commit -qm "prévias ${{ github.run_id }}" && git push -q origin previas || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-biblico-${{ github.run_id }}
          path: |
            saida/**/video.mp4
            saida/**/roteiro.json
            saida/**/post.txt
            saida/**/previa_*.jpg
          retention-days: 14
          if-no-files-found: ignore
