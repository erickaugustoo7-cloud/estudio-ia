name: Publicar aprovados

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read
  actions: read      # para baixar o vídeo do artefato

concurrency:
  group: publicar-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event.label.name == 'aprovado' && !contains(github.event.issue.labels.*.name, 'publicado')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IG_TOKEN_BIBLICO: ${{ secrets.IG_TOKEN_BIBLICO }}
      IG_TOKEN_ESPACO: ${{ secrets.IG_TOKEN_ESPACO }}
      META_TOKEN_BIBLICO: ${{ secrets.META_TOKEN_BIBLICO }}
      IG_MAXRATE: ${{ vars.IG_MAXRATE || '2500k' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: FedericoCarboni/setup-ffmpeg@v3
        id: ff
        continue-on-error: true
      - uses: FedericoCarboni/setup-ffmpeg@v3  # 2ª tentativa (o download às vezes falha)
        id: ff2
        if: steps.ff.outcome == 'failure'
        continue-on-error: true
      - if: steps.ff.outcome == 'failure' && steps.ff2.outcome == 'failure'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements.txt
      - run: python -m estudio.publicar --issue ${{ github.event.issue.number }}

  rejeitar:
    if: github.event.label.name == 'rejeitado' && contains(github.event.issue.labels.*.name, 'aprovacao')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh issue close ${{ github.event.issue.number }} --reason "not planned" --comment "Descartado. 🗑️"
