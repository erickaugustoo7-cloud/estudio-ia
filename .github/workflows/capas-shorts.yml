name: Capas dos Shorts
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "IDs separados por vírgula, ou recentes:15"
        required: true
        default: "recentes:15"
jobs:
  capas:
    runs-on: ubuntu-latest
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements.txt
      - run: python ferramentas/capas_shorts.py "${{ inputs.ids }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: capas-shorts, path: capas_shorts/*.jpg}
