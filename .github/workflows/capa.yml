name: Gerar capa do Facebook
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capa:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pillow
      - run: python ferramentas/gerar_capa.py
      - run: |
          git config user.name "estudio-ia[bot]"
          git config user.email "estudio-ia@users.noreply.github.com"
          git add assets/perfil && git commit -qm "capa do Facebook" && git push -q
