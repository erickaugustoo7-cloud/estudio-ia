name: Amostras de voz (Gemini)

on:
  workflow_dispatch:
    inputs:
      modelo:
        description: "Modelo TTS (vazio = automático)"
        required: false
      vozes:
        description: "Vozes separadas por vírgula (vazio = as 5 padrão + a atual)"
        required: false

jobs:
  amostras:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MODELO: ${{ inputs.modelo }}
      VOZES: ${{ inputs.vozes }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q requests edge-tts
      - run: python ferramentas/amostras_gemini.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amostras-gemini
          path: amostras_gemini/*.mp3
