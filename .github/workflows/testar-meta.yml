name: Testar chave da Meta
on:
  workflow_dispatch:
jobs:
  testar:
    runs-on: ubuntu-latest
    env:
      META_TOKEN_BIBLICO: ${{ secrets.META_TOKEN_BIBLICO }}
    steps:
      - name: Conferir (não mostra a chave)
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          t = os.environ.get("META_TOKEN_BIBLICO")
          if not t:
              print("SEM CHAVE"); raise SystemExit(1)
          def get(path, **p):
              p["access_token"] = t
              try:
                  return json.load(urllib.request.urlopen("https://graph.facebook.com/v23.0/" + path + "?" + urllib.parse.urlencode(p), timeout=30))
              except urllib.error.HTTPError as e:
                  return {"erro": e.read().decode()[:300]}
          me = get("me", fields="id,name,instagram_business_account{id,username}")
          print("Página:", me.get("name"), "| Instagram:", (me.get("instagram_business_account") or {}).get("username"), "|", me.get("erro", "ok"))
          dbg = get("debug_token", input_token=t)
          d = dbg.get("data", {})
          ig = (me.get("instagram_business_account") or {}).get("id")
          if ig:
              print("cota de publicação IG (24h):", get(ig + "/content_publishing_limit", fields="quota_usage,config"))
          print("app:", d.get("application"), d.get("app_id"))
          rl = get(me.get("id", "me") + "/video_reels", fields="id,created_time,views,status,privacy", limit=12)
          for v in rl.get("data", []):
              print("reel", v.get("id"), v.get("created_time"), "views:", v.get("views"), "|", (v.get("status") or {}).get("video_status"),
                    (v.get("status") or {}).get("publishing_phase", {}).get("status"), (v.get("privacy") or {}).get("value"))
          print(rl.get("erro", ""))
          for vid in ["1826745085229617"]:
              r = get(vid, fields="privacy,published,permalink_url,views,status")
              print("vídeo", vid, json.dumps(r)[:600])
              print("insights", json.dumps(get(vid + "/video_insights"))[:900])
          print("tipo:", d.get("type"), "| expira:", d.get("expires_at"), "| válida:", d.get("is_valid"), "| permissões:", ",".join(d.get("scopes", [])), dbg.get("erro", ""))
          PY
