name: Teste acervo de museus
on:
  workflow_dispatch:
    inputs:
      buscas:
        default: "egyptian statue;egyptian papyrus;roman fresco;roman coin;terracotta warrior;stone age tool;ancient greek vase;medieval manuscript"
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pillow
      - run: python ferramentas/teste_acervo.py "${{ inputs.buscas }}"
      - run: python -c "from PIL import Image;import glob;fs=sorted(glob.glob('acervo_teste/*.jpg'));ims=[Image.open(f).convert('RGB').resize((480,320)) for f in fs];m=Image.new('RGB',(480*4,320*((len(ims)+3)//4)));[m.paste(im,((i%4)*480,(i//4)*320)) for i,im in enumerate(ims)];m.save('mosaico.jpg',quality=60)" 
      - run: python -c "import base64;b=base64.b64encode(open('mosaico.jpg','rb').read()).decode();[print('B64:'+b[i:i+3000]) for i in range(0,len(b),3000)]"
