slug: biblico
nome: "Mensageiro de Fé"
idioma: pt-BR

# ---------- Identidade editorial ----------
persona: >
  Narrador cristão acolhedor, sereno e reverente. Fala com o coração, em linguagem
  simples, como quem conversa com um amigo. Linha cristã ampla, sem doutrina de
  nenhuma denominação específica.

linha_editorial:
  - "PRIORIDADE (dados reais do canal): Jesus como personagem principal, em momentos de emoção forte nos Evangelhos (lágrimas, toque, perdão, olhar, cruz). Mostrar como Jesus trata as pessoas e o que isso diz sobre como ele trata você. Evitar histórias longas do Antigo Testamento."
  - "Foco no que une os cristãos: amor de Deus, Jesus, graça, perdão, esperança, fé, oração, histórias bíblicas."
  - Evitar temas que dividem denominações (batismo infantil, intercessão de santos, Maria, dons espirituais, dízimo, escatologia detalhada, guarda do sábado).
  - Sempre indicar a referência bíblica (livro, capítulo e versículo).
  - Preferir parafrasear o texto bíblico; citar literalmente no máximo 2 versículos curtos por vídeo.
  - Contar histórias bíblicas com fidelidade ao texto, sem inventar detalhes.

proibido:
  - Prometer cura, milagre, prosperidade ou bênção em troca de seguir, curtir, compartilhar ou doar.
  - Pedir dinheiro, oferta ou doação.
  - Atacar outras religiões, denominações ou pessoas.
  - Política partidária.
  - Medo, culpa ou ameaça como gancho ("se não compartilhar...").

# Legenda do post no formato que mais engaja nos canais de referência: oração curta em 1ª pessoa
estilo_legenda: >
  A PRIMEIRA linha da legenda é uma oração curta em primeira pessoa, como quem fala com Deus
  (ex.: "Senhor, me ajuda a não desistir 🙏", "Tira de mim essa angústia, Deus... 😭",
  "Eu não sou mais o mesmo, Senhor ✝️"), ligada ao tema do vídeo, com no máximo 10 palavras.
  Depois, em 1 linha, a referência bíblica. Por último, um convite para comentar "Amém"
  ou salvar o vídeo. Nada de explicar o vídeo na legenda.

versao_biblica: "Parafrase própria com referência"   # troque pela versão que você licenciar
cta: "Salve este vídeo para ouvir de novo quando precisar, e siga para receber uma palavra de fé todos os dias."
hashtags_fixas: ["#fé", "#Deus", "#Bíblia", "#Jesus", "#palavradedeus"]

# ---------- Produção ----------
vozes:                          # alterna a cada vídeo (a primeira que funcionar)
  - pt-BR-AntonioNeural
  - pt-BR-ThalitaMultilingualNeural
# Voz: "gemini" (Gemini TTS, mais natural; cai para o Edge se falhar) ou "edge"
tts: gemini
gemini_tts:
  modelo: gemini-3.8-flash-tts
  voz: Enceladus
  duracao_max: 90               # acima disso, acelera levemente (até 15%)
  # tom da voz (metadado: não é narrado). Curto, como recomenda o Google.
  estilo_curto: "calmo, acolhedor e reverente, em português do Brasil, ritmo pausado"
motor_video: hyperframes       # hyperframes (animado) ou ffmpeg (simples e mais rápido)
voz: pt-BR-AntonioNeural
ritmo_voz: "-5%"
ritmo_por_voz:                  # ajuste para os vídeos ficarem entre ~75 e 90 s
  pt-BR-AntonioNeural: "+8%"
  pt-BR-ThalitaMultilingualNeural: "-2%"
palavras_alvo: [180, 210]       # ~65-75 s de narração (Creator Rewards exige > 60 s)
cenas: [7, 9]

# Abertura fixa DESLIGADA (05/11, decisão do Eric): a 1ª cena varia como as demais.
# Para religar: imagem_abertura: assets/aberturas/biblia.jpg
fonte_visual: pollinations_estrito   # só imagens geradas por IA (sem banco de imagens por palavra-chave)
# Dois estilos em teste A/B (sorteado a cada vídeo; o escolhido aparece na Issue)
estilos_visuais:
  pintura: >
    classical oil painting, biblical era, soft golden divine light, reverent and
    peaceful atmosphere, cinematic composition, vertical 9:16, highly detailed,
    no text, no letters, no watermark
  cinematico: >
    dark moody cinematic photography, dramatic mountains, misty roads at night,
    stormy sky with a single beam of light, lone silhouette, deep shadows, film grain,
    muted desaturated colors, ultra realistic, vertical 9:16, no text, no letters, no watermark
estilo_visual: >
  classical oil painting, biblical era, soft golden divine light, reverent and
  peaceful atmosphere, cinematic composition, vertical 9:16, highly detailed,
  no text, no letters, no watermark

musica: assets/musica/biblico   # .mp3 seus aqui têm prioridade; vazio = trilha ambiente gerada
trilha_gerada: true
musica_volume: 0.3          # trilha ~16 dB abaixo da voz (faixas normalizadas a -20 LUFS)

# ---------- Publicação ----------
# Instagram + Página do Facebook com a chave da Página (META_TOKEN_BIBLICO). TikTok: manual.
publicar_em: [instagram, facebook, youtube]   # youtube só publica com os segredos YT_* configurados
secret_token_meta: META_TOKEN_BIBLICO
secret_token_instagram: IG_TOKEN_BIBLICO   # reserva (chave antiga só do Instagram)
